name: Build TOTOLINK X30 ImmortalWrt

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/x30.config"
      - "patches/**"
      - ".github/workflows/build-x30-25.12.yml"
  schedule:
    - cron: "0 3 * * 6"

permissions:
  contents: write

concurrency:
  group: x30-immortalwrt-release
  cancel-in-progress: false

env:
  X30_PATCH_COMMIT: 1e4bed859aeb3c7047ee602866d833efed853e2d
  BUILD_JOBS: 2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6

      - name: Show builder repository contents
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 3 -type f | sort

      - name: Validate builder inputs
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            config/x30.config
            patches/0001-mediatek-add-TOTOLINK-X30-support.patch
            patches/0002-mediatek-filogic-add-totolink-x30-fit-upgrade.patch
          )

          for file in "${required_files[@]}"; do
            if [ ! -s "${file}" ]; then
              echo "ERROR: Required builder input is missing or empty: ${file}"
              exit 1
            fi
          done

          required_config_symbols=(
            CONFIG_TARGET_mediatek=y
            CONFIG_TARGET_mediatek_filogic=y
            CONFIG_TARGET_mediatek_filogic_DEVICE_totolink_X30=y
            CONFIG_PACKAGE_luci=y
            CONFIG_PACKAGE_luci-ssl=y
          )

          for symbol in "${required_config_symbols[@]}"; do
            if ! grep -Fxq "${symbol}" config/x30.config; then
              echo "ERROR: Required line is missing from config/x30.config: ${symbol}"
              exit 1
            fi
          done

          if grep -q 'compatible = "totolink,X30", "mediatek,mt7981";' patches/0001-mediatek-add-TOTOLINK-X30-support.patch; then
            echo "ERROR: Patch 0001 still contains the broken uppercase Linux DTS compatible string."
            exit 1
          fi

          if ! grep -q 'compatible = "totolink,x30", "mediatek,mt7981";' patches/0001-mediatek-add-TOTOLINK-X30-support.patch; then
            echo "ERROR: Patch 0001 does not contain the fixed lowercase Linux DTS compatible string."
            exit 1
          fi

          if ! grep -q 'SUPPORTED_DEVICES := totolink,X30 totolink,x30' patches/0001-mediatek-add-TOTOLINK-X30-support.patch; then
            echo "ERROR: Patch 0001 does not contain both legacy and fixed supported-device names."
            exit 1
          fi

          if ! grep -q 'totolink,X30' patches/0002-mediatek-filogic-add-totolink-x30-fit-upgrade.patch; then
            echo "ERROR: Patch 0002 does not contain legacy uppercase board-name support."
            exit 1
          fi

          if ! grep -q 'totolink,x30' patches/0002-mediatek-filogic-add-totolink-x30-fit-upgrade.patch; then
            echo "ERROR: Patch 0002 does not contain normalized lowercase board-name support."
            exit 1
          fi

      - name: Set latest ImmortalWrt 25.12 stable release
        shell: bash
        run: |
          set -euo pipefail

          IMMORTALWRT_VERSION="$(
            git ls-remote --tags --refs \
              https://github.com/immortalwrt/immortalwrt.git \
              'refs/tags/v25.12.*' |
            awk -F/ '{print $3}' |
            sed 's/^v//' |
            grep -E '^25\.12\.[0-9]+$' |
            sort -V |
            tail -n1
          )"

          if [ -z "${IMMORTALWRT_VERSION}" ]; then
            echo "ERROR: Could not determine latest ImmortalWrt 25.12 stable release."
            exit 1
          fi

          IMMORTALWRT_REF="v${IMMORTALWRT_VERSION}"

          echo "Latest stable ImmortalWrt version: ${IMMORTALWRT_VERSION}"
          echo "ImmortalWrt release tag: ${IMMORTALWRT_REF}"

          echo "IMMORTALWRT_VERSION=${IMMORTALWRT_VERSION}" >> "$GITHUB_ENV"
          echo "IMMORTALWRT_REF=${IMMORTALWRT_REF}" >> "$GITHUB_ENV"

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-pyelftools python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl time jq


      - name: Clone ImmortalWrt stable release
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --branch "${IMMORTALWRT_REF}" \
            --single-branch \
            https://github.com/immortalwrt/immortalwrt.git openwrt

          cd openwrt

          echo "ImmortalWrt release:"
          git describe --tags --exact-match HEAD

          echo "ImmortalWrt HEAD:"
          git log -1 --oneline

          echo "Resolved commit:"
          git rev-parse HEAD

      - name: Prepare X30 source tree
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt
          git config user.name "x30-builder"
          git config user.email "x30-builder@example.invalid"

          required_openwrt_paths=(
            target/linux/mediatek/image/filogic.mk
            target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh
          )

          for path in "${required_openwrt_paths[@]}"; do
            if [ ! -f "${path}" ]; then
              echo "ERROR: Expected ImmortalWrt path is missing in ${IMMORTALWRT_REF}: ${path}"
              echo "The latest release may have moved files that this builder patches."
              exit 1
            fi
          done

          UPSTREAM_SHA="$(git rev-parse --short=12 HEAD)"
          CONFIG_HASH="$(sha256sum \
            ../config/x30.config \
            ../patches/0001-mediatek-add-TOTOLINK-X30-support.patch \
            ../patches/0002-mediatek-filogic-add-totolink-x30-fit-upgrade.patch \
            ../.github/workflows/build-x30-25.12.yml \
            | sha256sum | cut -c1-12)"

          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "config_hash=${CONFIG_HASH}" >> "$GITHUB_OUTPUT"
          echo "immortalwrt_version=${IMMORTALWRT_VERSION}" >> "$GITHUB_OUTPUT"

          if grep -q "Device/totolink_X30" target/linux/mediatek/image/filogic.mk; then
            echo "X30 image profile already exists in ${IMMORTALWRT_REF}; not applying profile patch."
            PATCH_ID="official"
          else
            echo "Applying pinned X30 board-support patch: ${X30_PATCH_COMMIT}"
            git am --3way "../patches/0001-mediatek-add-TOTOLINK-X30-support.patch"
            PATCH_ID="${X30_PATCH_COMMIT:0:12}"
          fi

          echo "Applying X30 FIT sysupgrade platform patch"
          if grep -q "totolink,X30" target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh && \
             grep -q "totolink,x30" target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh; then
            echo "X30 FIT sysupgrade handler already exists; not applying local platform patch."
          else
            git apply "../patches/0002-mediatek-filogic-add-totolink-x30-fit-upgrade.patch"
          fi

          echo "Verifying X30 image profile"
          grep -n "Device/totolink_X30" target/linux/mediatek/image/filogic.mk
          grep -n "TARGET_DEVICES += totolink_X30" target/linux/mediatek/image/filogic.mk
          grep -n "SUPPORTED_DEVICES := .*totolink,X30.*totolink,x30" target/linux/mediatek/image/filogic.mk

          echo "Verifying normalized X30 board name and rootdisk"
          grep -n 'compatible = "totolink,x30", "mediatek,mt7981";' target/linux/mediatek/dts/mt7981b-totolink-X30.dts
          grep -n 'rootdisk = <&ubi_rootdisk>;' target/linux/mediatek/dts/mt7981b-totolink-X30.dts
          grep -n 'volname = "fit";' target/linux/mediatek/dts/mt7981b-totolink-X30.dts

          echo "Verifying X30 FIT upgrade handlers"
          grep -n "totolink,X30" target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh
          grep -n "totolink,x30" target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh

          TAG="x30-${IMMORTALWRT_VERSION}-${UPSTREAM_SHA}-${PATCH_ID}-${CONFIG_HASH}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "patch_id=${PATCH_ID}" >> "$GITHUB_OUTPUT"

          if git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release tag ${TAG} already exists. Nothing new to build."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update feeds
        if: steps.prep.outputs.skip_build != 'true'
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build
        if: steps.prep.outputs.skip_build != 'true'
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          cp ../config/x30.config .config
          echo "Seed config:"
          cat .config

          make defconfig

          echo "Resolved important config lines:"
          grep -E 'CONFIG_TARGET_mediatek|CONFIG_TARGET_mediatek_filogic_DEVICE_totolink_X30|CONFIG_BUILD_LOG' .config || true
          required_config_symbols=(
            CONFIG_TARGET_mediatek_filogic_DEVICE_totolink_X30
          )

          for symbol in "${required_config_symbols[@]}"; do
            if ! grep -q "^${symbol}=y" .config; then
              echo "ERROR: Required symbol ${symbol}=y was not selected after make defconfig."
              grep -Ei 'x30|totolink|CONFIG_TARGET_mediatek' .config || true
              exit 1
            fi
          done

          echo "ImmortalWrt diffconfig:"
          ./scripts/diffconfig.sh

          echo "ImmortalWrt make info entries matching x30/totolink:"
          make info | grep -Ei 'x30|totolink' || true

      - name: Download sources
        if: steps.prep.outputs.skip_build != 'true'
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          make download -j"$(nproc)"

      - name: Build firmware
        if: steps.prep.outputs.skip_build != 'true'
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          df -h

          if ! make -j"${BUILD_JOBS}" V=s 2>&1 | tee ../build.log; then
            echo "Parallel build failed. Retrying single-threaded to expose exact failing command..."
            make -j1 V=sc 2>&1 | tee ../build-single.log
            exit 1
          fi

          df -h

      - name: Collect artifacts
        if: steps.prep.outputs.skip_build != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out
          cd openwrt
          TARGET_DIR="bin/targets/mediatek/filogic"

          echo "Full target directory contents:"
          find "${TARGET_DIR}" -maxdepth 2 -type f -printf '%p\n' | sort

          echo "Searching for X30/TOTOLINK firmware artifacts:"
          find "${TARGET_DIR}" -maxdepth 1 -type f \
            \( -iname '*x30*' -o -iname '*totolink*' \) \
            -printf '%p\n' | sort | tee ../x30-artifact-list.txt

          if [ ! -s ../x30-artifact-list.txt ]; then
            echo "ERROR: No X30/TOTOLINK firmware artifacts found."
            exit 1
          fi

          while IFS= read -r artifact; do
            cp -v "$artifact" ../out/
          done < ../x30-artifact-list.txt

          for meta in sha256sums config.buildinfo feeds.buildinfo version.buildinfo profiles.json; do
            [ -f "${TARGET_DIR}/${meta}" ] && cp -v "${TARGET_DIR}/${meta}" "../out/${meta}"
          done

          ./scripts/diffconfig.sh > ../out/x30.diffconfig
          git rev-parse HEAD > ../out/immortalwrt-git-head.txt
          git log -1 --oneline > ../out/immortalwrt-git-log.txt
          cp ../x30-artifact-list.txt ../out/x30-artifact-list.txt

          cd ../out
          sha256sum * > BUILD-SHA256SUMS.txt
          ls -lh

          SYSUPGRADE_IMAGE="$(find . -maxdepth 1 -type f \( -iname '*x30*sysupgrade*.bin' -o -iname '*totolink*sysupgrade*.bin' \) | sort | head -n 1)"
          if [ -z "${SYSUPGRADE_IMAGE}" ]; then
            echo "ERROR: No X30/TOTOLINK sysupgrade image found."
            exit 1
          fi
          echo "Found sysupgrade image: ${SYSUPGRADE_IMAGE}"

          FWTOOL="$(find ../openwrt/staging_dir -path '*/bin/fwtool' -type f | sort | head -n 1)"
          if [ -z "${FWTOOL}" ] || [ ! -x "${FWTOOL}" ]; then
            echo "ERROR: Could not find host fwtool to validate sysupgrade metadata."
            exit 1
          fi

          "${FWTOOL}" -q -i x30-sysupgrade.meta.json "${SYSUPGRADE_IMAGE}"

          echo "Sysupgrade metadata:"
          cat x30-sysupgrade.meta.json

          jq -e '.supported_devices | index("totolink,X30")' x30-sysupgrade.meta.json >/dev/null
          jq -e '.supported_devices | index("totolink,x30")' x30-sysupgrade.meta.json >/dev/null

          X30_MANIFEST="$(find . -maxdepth 1 -type f \( -iname '*x30*.manifest' -o -iname '*totolink*.manifest' \) | sort | head -n 1)"
          if [ -z "${X30_MANIFEST}" ]; then
            echo "ERROR: No X30/TOTOLINK manifest found."
            exit 1
          fi
          echo "Found X30 manifest: ${X30_MANIFEST}"

         
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-build-diagnostics
          path: |
            build.log
            build-single.log
            x30-artifact-list.txt
            openwrt/.config
            openwrt/tmp/.config*
            openwrt/logs/**
            openwrt/bin/targets/mediatek/filogic/**
          if-no-files-found: ignore

      - name: Upload workflow artifact
        if: steps.prep.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-totolink-x30-${{ env.IMMORTALWRT_VERSION }}
          path: out/*
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.prep.outputs.skip_build != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prep.outputs.tag }}
          IMMORTALWRT_REF: ${{ env.IMMORTALWRT_REF }}
          IMMORTALWRT_VERSION: ${{ env.IMMORTALWRT_VERSION }}
          UPSTREAM_SHA: ${{ steps.prep.outputs.upstream_sha }}
          PATCH_ID: ${{ steps.prep.outputs.patch_id }}
          CONFIG_HASH: ${{ steps.prep.outputs.config_hash }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${TAG}" out/* \
            --title "TOTOLINK X30 ImmortalWrt ${IMMORTALWRT_VERSION} build ${TAG}" \
            --notes "Custom TOTOLINK X30 build from ImmortalWrt ${IMMORTALWRT_REF}.

          Upstream ImmortalWrt source SHA: ${UPSTREAM_SHA}
          X30 patch: ${PATCH_ID}
          Build config/patch/workflow hash: ${CONFIG_HASH}
          Target: mediatek/filogic
          Device profile: totolink_X30

          This build includes:
          - TOTOLINK X30 board support
          - TOTOLINK X30 FIT sysupgrade platform handler
          - Legacy board-name compatibility for totolink,X30
          - Normalized board-name compatibility for totolink,x30


          Routine upgrades should use only:
          immortalwrt-mediatek-filogic-totolink_X30-squashfs-sysupgrade.bin

          Do not flash preloader.bin or bl31-uboot.fip for routine upgrades."
